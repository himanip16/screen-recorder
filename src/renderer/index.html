<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Screen Capture</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="drag-handle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
  </div>

  <div class="dock-row">
    <button id="snap-full" class="icon-btn" data-tooltip="Full Screenshot">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
    </button>
    <button id="snap-area" class="icon-btn" data-tooltip="Area Screenshot">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    </button>

    <div class="divider"></div>

    <button id="snip" class="icon-btn" data-tooltip="Record Full Screen">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="3" rx="2"/><line x1="12" x2="12" y1="18" y2="21"/><line x1="8" x2="16" y1="21" y2="21"/></svg>
    </button>
    <button id="snip-area" class="icon-btn" data-tooltip="Record Area">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v3m0 12v3m12-18v3m0 12v3M3 6h3m12 0h3M3 18h3m12 0h3"/></svg>
    </button>

    <div class="divider"></div>

    <button id="pause" class="icon-btn" disabled data-tooltip="Pause">
      <span id="pause-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </span>
    </button>
    <button id="stop" class="icon-btn" data-tooltip="Stop & Save">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
    </button>
  </div>

  <div class="divider"></div>

  <div class="dock-row">
    <label class="audio-toggle" data-tooltip="Microphone Track">
      <input type="checkbox" id="record-audio" checked>
      <div class="toggle-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </div>
    </label>

    <span id="recording-status" class="status-badge status-idle" data-tooltip="Idle">
      <span class="status-dot"></span>
    </span>
  </div>

  <div class="divider"></div>

  <div class="dock-row">
    <button id="close-app" class="icon-btn close-btn" data-tooltip="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <script src="js/actions.js"></script>
</body>
</html>
