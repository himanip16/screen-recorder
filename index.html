<!DOCTYPE html>
<html>
<head>
  <title>Screen Recorder</title>
  
  <style>
    .controls-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: sans-serif;
      margin-top: 20px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .status-idle {
      background-color: #e0e0e0;
      color: #555;
    }
    .status-recording {
      background-color: #ffebee;
      color: #c62828;
    }
    .status-paused {
      background-color: #fff3e0;
      color: #ef6c00;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
      display: inline-block;
    }

    .status-recording .status-dot {
      animation: pulse 1.2s infinite;
    }
    .status-paused .status-dot {
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>My Screen Recorder</h1>

<div class="controls-container">
  <button id="snap-full">Take Screenshot</button>
  <button id="snip">Record Screen</button>
  <button id="snip-area">Record Area</button>
  <button id="pause" disabled>Pause</button>
  <button id="stop">Stop</button>

  <label style="font-family: sans-serif; font-size: 13px; display: inline-flex; align-items: center; gap: 4px;">
    <input type="checkbox" id="record-audio" checked> Include Audio
  </label>

  <span id="recording-status" class="status-badge status-idle">
    <span class="status-dot"></span> <span id="status-text">Idle</span>
  </span>
</div>

  <script src="renderer.js"></script>
</body>
</html>
